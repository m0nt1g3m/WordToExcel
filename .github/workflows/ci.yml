name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target_os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            arch: amd64
            os: ubuntu-latest
            script: ./scripts/build_linux_amd64.sh
          - target_os: linux
            arch: arm64
            os: ubuntu-24.04-arm
            script: ./scripts/build_linux_arm64.sh

          - target_os: windows
            arch: amd64
            os: windows-latest
            script: .\scripts\build_win_amd64.ps1
          - target_os: windows
            arch: arm64
            os: windows-latest
            script: .\scripts\build_win_arm64.ps1

          - target_os: macos
            arch: amd64
            os: macos-11
            script: ./scripts/build_mac_amd64.sh
          - target_os: macos
            arch: arm64
            os: macos-latest
            script: ./scripts/build_mac_arm64.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxfixes-dev \
            libgles2-mesa-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_deps.ps1

      - name: Install Unix dependencies
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: ./scripts/install_deps.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: ${{ matrix.script }}

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxfixes-dev \
            libgles2-mesa-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_deps.ps1

      - name: Install Unix dependencies
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: ./scripts/install_deps.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./cmd/... ./internal/...