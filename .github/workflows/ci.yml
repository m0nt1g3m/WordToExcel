name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxfixes-dev \
            libgles2-mesa-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_deps.ps1

      - name: Install Unix dependencies
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: ./scripts/install_deps.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application for amd64 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build_win_amd64.ps1

      - name: Build application for arm64 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\build_win_arm64.ps1

      - name: Build application for amd64 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build_mac_amd64.sh

      - name: Build application for arm64 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/build_mac_arm64.sh

      - name: Build application for amd64 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build_linux_amd64.sh

      - name: Build application for arm64 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build_linux_arm64.sh

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxfixes-dev \
            libgles2-mesa-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_deps.ps1

      - name: Install Unix dependencies
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: ./scripts/install_deps.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./cmd/... ./internal/...